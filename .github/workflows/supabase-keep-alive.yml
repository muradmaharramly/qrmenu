name: Supabase Keep Alive

on:
  schedule:
    # Runs twice a day at 04:00 and 16:00 UTC (every 12 hours)
    - cron: '0 4,16 * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab

jobs:
  keep-alive:
    name: Ping Supabase Database
    runs-on: ubuntu-latest
    steps:
      - name: Send keep-alive query to Supabase PostgREST
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://hviozmodqjjegyvnxhtp.supabase.co' }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh2aW96bW9kcWpqZWd5dm54aHRwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjYwODE2OTAsImV4cCI6MjA4MTY1NzY5MH0.3JqAX6cPeUguVegv8Z6BIPaV8R2Lk2r5LrM6aICyP5Y' }}
        run: |
          echo "Pinging Supabase table endpoint to prevent pause..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X GET "${SUPABASE_URL}/rest/v1/menu_items?limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")
          
          echo "Response HTTP Status: ${HTTP_STATUS}"
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "Success: Supabase database is active and responded successfully."
          else
            echo "Warning: Response status was ${HTTP_STATUS}."
            exit 1
          fi
